[project]
name = "skep"
version = "0.1.0"
description = "Telegram control plane for headless Claude Code agents"
requires-python = ">=3.13"
dependencies = ["aiogram>=3.13", "aiohttp>=3.10", "zeroconf>=0.130", "mcp>=1.2"]

[project.scripts]
skep = "skep.app:run"
skep-queen = "skep.queen.app:run"
skepd = "skep.worker.app:run"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "mdns: requires working multicast loopback",
    "integration: requires a real `claude` CLI; opt in with SKEP_RUN_INTEGRATION=1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skep"]

[tool.ty.environment]
python-version = "3.13"
python = "./.venv"
root = ["./src"]
# `tests` is on sys.path for the suite (pytest rootdir insert), so `import conftest`
# resolves at runtime. extra-paths tells ty the same without reclassifying src.
extra-paths = ["./tests"]

[tool.ty.src]
include = ["src", "tests"]
exclude = ["**/__pycache__", "build", "dist"]
respect-ignore-files = true

[tool.ty.terminal]
# src is clean, so any future warning is a regression, not backlog.
error-on-warning = true

# Tests are exempt from these five rules — not from ty. Both causes are
# structural, not latent bugs:
#   - unresolved-attribute (111): tests dereference an Optional lookup directly
#     (`store.get(ref).status`) rather than narrowing it first.
#   - invalid-argument-type (163): hand-written test doubles. `_Bookkeepingish`
#     IS a Protocol, but doubles are ANN-exempt below, so their unannotated
#     signatures don't structurally match; `Gateway` is a concrete class, so no
#     double satisfies it nominally without extracting a Protocol in src.
# The way back is annotating the doubles (drop the ANN exemption) and extracting
# Protocols in src — not widening this list. src stays at full strictness.
[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
unresolved-attribute = "ignore"
unsupported-operator = "ignore"
invalid-assignment = "ignore"
not-iterable = "ignore"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.format]
